[package]
name = "roast-bluetooth"
description = "Bluetooth Classic RFCOMM links on macOS through IOBluetooth (ADR 0013); the only crate with unsafe code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFDate", "CFString"] }
objc2-io-bluetooth = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "objc2-core-foundation",
    "Bluetooth",
    "IOBluetoothObject",
    "IOBluetoothDevice",
    "IOBluetoothRFCOMMChannel",
    "IOBluetoothSDPServiceRecord",
    "IOBluetoothSDPUUID",
    "IOBluetoothUserLib",
] }

# Not `lints.workspace`: the workspace forbids unsafe code, and calling
# IOBluetooth needs it. Everything else matches the workspace lints.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
