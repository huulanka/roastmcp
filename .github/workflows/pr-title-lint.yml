name: PR Title Lint

# The PR title becomes the squash-merge commit on main, and semantic-release
# reads that commit to decide the next version. Catch a bad title before merge.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  lint-pr-title:
    name: Prospective squash-merge commit header
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint prospective squash-merge commit header
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "${PR_TITLE} (#${PR_NUMBER})" | npx commitlint --config ./commitlint.config.mjs
