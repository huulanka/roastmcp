name: Release app

# Builds the desktop app with the daemon sidecar for every platform when a
# release is published, attaches the installers, and points the Homebrew cask
# at the new macOS build (ADR 0009). macOS builds are ad-hoc signed, not
# notarised; Windows and Linux builds are previews (ADR 0010).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pattern: "app/src-tauri/target/release/bundle/dmg/*.dmg"
          - os: windows-latest
            pattern: "app/src-tauri/target/release/bundle/nsis/*.exe"
          - os: ubuntu-latest
            pattern: "app/src-tauri/target/release/bundle/appimage/*.AppImage app/src-tauri/target/release/bundle/deb/*.deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libasound2-dev pkg-config
      - name: Build the daemon sidecar
        shell: bash
        run: ./scripts/build-sidecar.sh
      - name: Build the app
        working-directory: app
        run: npm ci && npm run tauri build
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          for f in ${{ matrix.pattern }}; do gh release upload "$TAG" "$f" --clobber; done
      - name: Keep the macOS bundle for the cask
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: dmg
          path: app/src-tauri/target/release/bundle/dmg/*.dmg

  cask:
    name: Homebrew cask
    needs: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: dmg
          path: dist
      - name: Write and commit the cask
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          dmg="$(ls dist/*.dmg | head -n1)"
          ./scripts/write-cask.sh "${TAG#v}" "$dmg"
          brew style Casks/roastmcp.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/roastmcp.rb
          if git diff --cached --quiet; then echo "cask already current"; exit 0; fi
          git commit -m "chore(release): cask for ${TAG} [skip ci]"
          git push origin main
