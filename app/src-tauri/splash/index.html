<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoastMCP</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #141110;
        --fg: #efe7df;
        --muted: #9a8f86;
        --accent: #d9874f;
        --danger: #ff6b5a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        text-align: center;
        padding: 0 32px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 56ch;
      }
      pre {
        display: none;
        margin: 8px 0 0;
        max-width: 72ch;
        white-space: pre-wrap;
        text-align: left;
        color: var(--danger);
        font:
          13px/1.5 ui-monospace,
          Menlo,
          monospace;
        -webkit-user-select: text;
        user-select: text;
      }
      body.failed .dot {
        animation: none;
        background: var(--danger);
      }
      body.failed pre {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <h1>RoastMCP</h1>
      <p id="msg">Starting the roaster service…</p>
      <pre id="err"></pre>
    </main>
    <script>
      // Called by the app (Rust) when the daemon cannot be started.
      window.showError = function (title, detail) {
        document.body.classList.add("failed");
        document.getElementById("msg").textContent = title;
        document.getElementById("err").textContent = detail;
      };
    </script>
  </body>
</html>
