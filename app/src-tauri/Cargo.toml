[package]
name = "roastmcp-app"
version = "1.12.0"
description = "RoastMCP desktop app: a native window around the daemon and its UI"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/huulanka/roastmcp"
authors = ["Andreas Bauer"]
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "3", default-features = false, features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
